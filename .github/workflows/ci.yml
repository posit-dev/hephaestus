name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy + build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry, git, and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-host-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-host-

      # Mesa software rasteriser so the wgpu adapter request succeeds on
      # ubuntu-latest runners (no GPU available). Used by the `smoke` and
      # `picking` integration tests. fontconfig is the system font-discovery
      # library parley/fontique links against on Linux.
      - name: Install Mesa Vulkan drivers and fontconfig
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools libfontconfig1-dev

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --all-features
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: cargo build --no-default-features
        run: cargo build --no-default-features

      # Each raster writer must stand on its own: they share a module, so one
      # leaning on another's gated code would still pass every combination
      # above. The `--all-features` runs never build a feature in isolation.
      - name: cargo check, one writer feature at a time
        run: |
          for feature in png jpeg tiff webp; do
            cargo check --no-default-features --features "$feature"
          done

      # The sparse-strips backend must stand on its own: `--all-features`
      # builds it beside the compute-shader one, which would hide anything it
      # reaches for through the other backend's gates.
      - name: cargo clippy, the sparse-strips backend alone
        run: |
          cargo clippy --no-default-features --features vello-hybrid,png \
            --all-targets -- -D warnings

      # Presentation must work with either backend behind it, and the
      # hybrid-only combination is the one that would break if the window host
      # reached for the other backend's gates.
      - name: cargo clippy, presentation on each backend
        run: |
          for backend in vello vello-hybrid; do
            cargo clippy --no-default-features \
              --features "window,$backend,png" --all-targets -- -D warnings
          done

      - name: cargo test --all-features
        run: cargo test --all-features

  # `vello`, `vello_hybrid` and `parley` all declare 1.88, so that is the floor
  # for any build that includes them, whatever `rust-version` says. The jobs above all run on
  # stable and would not catch a newer language or std feature creeping in.
  msrv:
    name: MSRV (1.88, --all-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88

      - name: Cache cargo registry, git, and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-

      - name: Install fontconfig
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev

      - name: cargo check --all-features
        run: cargo check --all-features

  # The renderer-free document writer is what an R package vendoring this crate
  # for CRAN builds, and CRAN's toolchain is older than the 1.88 the job above
  # pins. `--ignore-rust-version` is needed because the `parley` family declares
  # 1.88 and is compiled here even though the renderer is not — the declaration
  # is what blocks the build, not the code, which compiles on 1.86. Dropping the
  # flag is what making `parley` optional would buy.
  msrv-document:
    name: MSRV (1.86, renderer-free document writer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.86
        uses: dtolnay/rust-toolchain@1.86

      - name: Cache cargo registry, git, and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-document-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-document-

      - name: Install fontconfig
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev

      # One direction at a time, for the reason `src/document/CLAUDE.md` gives:
      # a helper reachable from only one half still passes both other builds.
      - name: cargo check, one document feature at a time
        run: |
          for feature in document-write document-read document; do
            cargo check --no-default-features --features "$feature" \
              --all-targets --ignore-rust-version
          done

  # wasm32 is a supported target, so it gets its own job: it shares no compiled
  # artifacts with the host build and needs none of the system libraries above
  # (fontconfig and Vulkan are both gated to native targets). Catches
  # GL-backend and dependency regressions that the host build misses.
  wasm:
    name: wasm32 check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry, git, and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: cargo check --target wasm32-unknown-unknown
        run: cargo check --target wasm32-unknown-unknown

      # The raster encoders are pure Rust and expected to build for wasm; the
      # default-feature check above would not notice one that isn't. Named
      # explicitly rather than `--all-features` because `google-fonts` pulls
      # `ureq`, which has no wasm target.
      - name: cargo check --target wasm32-unknown-unknown --features jpeg,tiff,webp
        run: cargo check --target wasm32-unknown-unknown --features jpeg,tiff,webp

      # The render client's exact configuration: the canvas host plus a
      # read-only document reader, and nothing else. Checked on its own
      # because it is the one combination a website actually ships, and
      # because `canvas` compiles a host no other target has.
      # The client's default is WebGL2, so that is the configuration checked
      # first; `wgpu-backend` is the alternative and is checked after it.
      - name: cargo clippy, the wasm render client (default, WebGL2)
        working-directory: crates/hephaestus-wasm
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

      - name: cargo clippy, the wasm render client on wgpu
        working-directory: crates/hephaestus-wasm
        run: |
          cargo clippy --target wasm32-unknown-unknown --no-default-features \
            --features webfonts,wgpu-backend -- -D warnings

      # `window` on wasm has no caller — `run` is desktop-only — but the
      # module claims to compile there, and nothing else proves it.
      - name: cargo check --target wasm32-unknown-unknown --features window
        run: cargo check --target wasm32-unknown-unknown --features window

      # The sparse-strips backend over wgpu on wasm: still WebGPU, because
      # wgpu's own `webgl` feature is not compiled here (it costs +1.2 MB, being
      # shader translation). Going below WebGPU is the `webgl` feature's job,
      # checked separately below.
      - name: cargo clippy --target wasm32-unknown-unknown, sparse strips
        run: |
          cargo clippy --target wasm32-unknown-unknown --no-default-features \
            --features vello-hybrid,document-read -- -D warnings

      # What the render client would ship on sparse strips. Still WebGPU: see
      # the note above.
      # The WebGL2 build: no wgpu in the tree at all, so it is the one that
      # breaks if the scene layer reaches for a wgpu type.
      - name: cargo clippy --target wasm32-unknown-unknown, webgl
        run: |
          cargo clippy --target wasm32-unknown-unknown --no-default-features \
            --features webgl,document-read -- -D warnings

      - name: cargo clippy --target wasm32-unknown-unknown, canvas on each backend
        run: |
          for backend in vello vello-hybrid; do
            cargo clippy --target wasm32-unknown-unknown --no-default-features \
              --features "canvas,$backend,document-read" -- -D warnings
          done

  # The wasm bundle a page loads. Its own job because `crates/hephaestus-wasm`
  # is a separate workspace with its own lock file and release profile, so it
  # shares no artifacts with the checks above.
  client:
    name: wasm render client (wasm-pack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry, git, and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/hephaestus-wasm/target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('crates/hephaestus-wasm/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: assemble the package
        working-directory: crates/hephaestus-wasm
        run: ./build.sh

      # Loads the assembled package the way a consumer meets it and checks the
      # manifest against what is on disk: a renamed export, a file missing
      # from `files[]`, a version out of step with the crate, or a wrapper
      # importing the glue by the wrong path all fail here rather than after
      # publishing.
      - name: verify the package
        working-directory: crates/hephaestus-wasm
        run: node verify-dist.mjs

      # `npm pack` is the last word on what would actually ship, and the
      # tarball it writes here is the one `publish-npm` pushes — nothing is
      # rebuilt between verification and release.
      - name: pack and report the tarball
        working-directory: crates/hephaestus-wasm/dist
        run: |
          npm pack --json > /tmp/pack.json
          node -e "
            const p = require('/tmp/pack.json')[0];
            const names = p.files.map((f) => f.path).sort().join(', ');
            console.log('tarball: ' + p.filename);
            console.log('files:   ' + names);
            console.log('size:    ' + p.size + ' packed / ' + p.unpackedSize + ' unpacked');
          " | tee -a "$GITHUB_STEP_SUMMARY"
          wasm=hephaestus_wasm_bg.wasm
          echo "wasm: $(stat -c%s $wasm) raw; $(brotli -q 11 -c $wasm | wc -c) brotli" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload npm tarball
        uses: actions/upload-artifact@v4
        with:
          name: hephaestus-wasm-npm
          path: crates/hephaestus-wasm/dist/*.tgz
          retention-days: 30

  # Publishes on a `v*` tag and nowhere else. It pushes the tarball `client`
  # already built and `verify-dist.mjs` already checked, rather than building
  # its own, so what reaches the registry is what CI saw.
  publish-npm:
    name: Publish to npm
    needs: [client]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: npm
    permissions:
      # OIDC, for `--provenance`. SRI is not usable for ES module imports, so
      # a verifiable link back to this workflow run is the integrity story a
      # consumer loading from a CDN actually gets.
      id-token: write
      contents: read

    steps:
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Download npm tarball
        uses: actions/download-artifact@v4
        with:
          name: hephaestus-wasm-npm
          path: npm-tarball

      - name: Update npm for OIDC support
        # Install v10.9.8 first as a workaround for nodejs/node#62425.
        run: |
          npm install -g npm@10.9.8
          npm install -g npm@latest

      # A prerelease tag lands on `next`, so `npm install hephaestus-wasm`
      # keeps resolving to the last stable release.
      - name: Determine npm dist-tag
        id: dist-tag
        run: |
          if [[ "$GITHUB_REF_NAME" == *"-dev"* || "$GITHUB_REF_NAME" == *"-rc"* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # `verify-dist.mjs` ties the manifest to the crate version; this ties
      # both to the tag. Without it a mistyped tag publishes whatever
      # `Cargo.toml` held, which on a first publish succeeds under the wrong
      # number.
      - name: Check the tag matches the package version
        run: |
          version=$(basename ./npm-tarball/*.tgz .tgz | sed 's/^hephaestus-wasm-//')
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "tag $GITHUB_REF_NAME does not match packaged version $version" >&2
            exit 1
          fi

      - name: Publish to npm
        run: npm publish ./npm-tarball/*.tgz --access=public --provenance --tag ${{ steps.dist-tag.outputs.tag }}
