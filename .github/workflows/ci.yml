name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy + build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry, git, and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-host-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-host-

      # Mesa software rasteriser so the wgpu adapter request succeeds on
      # ubuntu-latest runners (no GPU available). Used by the `smoke` and
      # `picking` integration tests. fontconfig is the system font-discovery
      # library parley/fontique links against on Linux.
      - name: Install Mesa Vulkan drivers and fontconfig
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools libfontconfig1-dev

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --all-features
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: cargo build --no-default-features
        run: cargo build --no-default-features

      # Each raster writer must stand on its own: they share a module, so one
      # leaning on another's gated code would still pass every combination
      # above. The `--all-features` runs never build a feature in isolation.
      - name: cargo check, one writer feature at a time
        run: |
          for feature in png jpeg tiff webp; do
            cargo check --no-default-features --features "$feature"
          done

      - name: cargo test --all-features
        run: cargo test --all-features

  # `vello` and `parley` both declare 1.88, so that is the floor for any build
  # that includes them, whatever `rust-version` says. The jobs above all run on
  # stable and would not catch a newer language or std feature creeping in.
  msrv:
    name: MSRV (1.88, --all-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88

      - name: Cache cargo registry, git, and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-

      - name: Install fontconfig
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev

      - name: cargo check --all-features
        run: cargo check --all-features

  # The renderer-free document writer is what an R package vendoring this crate
  # for CRAN builds, and CRAN's toolchain is older than the 1.88 the job above
  # pins. `--ignore-rust-version` is needed because the `parley` family declares
  # 1.88 and is compiled here even though the renderer is not — the declaration
  # is what blocks the build, not the code, which compiles on 1.86. Dropping the
  # flag is what making `parley` optional would buy.
  msrv-document:
    name: MSRV (1.86, renderer-free document writer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.86
        uses: dtolnay/rust-toolchain@1.86

      - name: Cache cargo registry, git, and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-document-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-document-

      - name: Install fontconfig
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev

      # One direction at a time, for the reason `src/document/CLAUDE.md` gives:
      # a helper reachable from only one half still passes both other builds.
      - name: cargo check, one document feature at a time
        run: |
          for feature in document-write document-read document; do
            cargo check --no-default-features --features "$feature" \
              --all-targets --ignore-rust-version
          done

  # wasm32 is a supported target, so it gets its own job: it shares no compiled
  # artifacts with the host build and needs none of the system libraries above
  # (fontconfig and Vulkan are both gated to native targets). Catches
  # GL-backend and dependency regressions that the host build misses.
  wasm:
    name: wasm32 check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry, git, and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: cargo check --target wasm32-unknown-unknown
        run: cargo check --target wasm32-unknown-unknown

      # The raster encoders are pure Rust and expected to build for wasm; the
      # default-feature check above would not notice one that isn't. Named
      # explicitly rather than `--all-features` because `google-fonts` pulls
      # `ureq`, which has no wasm target.
      - name: cargo check --target wasm32-unknown-unknown --features jpeg,tiff,webp
        run: cargo check --target wasm32-unknown-unknown --features jpeg,tiff,webp

      # The render client's exact configuration: the canvas host plus a
      # read-only document reader, and nothing else. Checked on its own
      # because it is the one combination a website actually ships, and
      # because `canvas` compiles a host no other target has.
      - name: cargo clippy, the wasm render client
        run: |
          cargo clippy --target wasm32-unknown-unknown --no-default-features \
            --features vello,canvas,document-read -- -D warnings

      # `window` on wasm has no caller — `run` is desktop-only — but the
      # module claims to compile there, and nothing else proves it.
      - name: cargo check --target wasm32-unknown-unknown --features window
        run: cargo check --target wasm32-unknown-unknown --features window

  # The wasm bundle a page loads. Its own job because `crates/hephaestus-web`
  # is a separate workspace with its own lock file and release profile, so it
  # shares no artifacts with the checks above.
  web:
    name: wasm render client (wasm-pack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry, git, and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/hephaestus-web/target
          key: ${{ runner.os }}-cargo-web-${{ hashFiles('crates/hephaestus-web/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-web-

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: assemble the package
        working-directory: crates/hephaestus-web
        run: ./build.sh

      # Loads the assembled package the way a consumer meets it and checks the
      # manifest against what is on disk: a renamed export, a file missing
      # from `files[]`, a version out of step with the crate, or a wrapper
      # importing the glue by the wrong path all fail here rather than after
      # publishing.
      - name: verify the package
        working-directory: crates/hephaestus-web
        run: node verify-dist.mjs

      # `npm pack` is the last word on what would actually ship.
      - name: report the published tarball
        working-directory: crates/hephaestus-web/dist
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e "
            const p = require('/tmp/pack.json')[0];
            const names = p.files.map((f) => f.path).sort().join(', ');
            console.log('tarball: ' + p.filename);
            console.log('files:   ' + names);
            console.log('size:    ' + p.size + ' packed / ' + p.unpackedSize + ' unpacked');
          " | tee -a "$GITHUB_STEP_SUMMARY"
          wasm=hephaestus_web_bg.wasm
          echo "wasm: $(stat -c%s $wasm) raw; $(brotli -q 11 -c $wasm | wc -c) brotli" \
            | tee -a "$GITHUB_STEP_SUMMARY"
