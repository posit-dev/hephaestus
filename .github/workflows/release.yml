name: Release

# A `v*` tag is the only trigger, and releasing is all this file does. The
# trusted-publisher registrations on npm and crates.io both name a workflow
# filename, so keeping the publish jobs out of `check.yml` means a change to the
# everyday CI file cannot grant publish rights to either registry.
on:
  push:
    tags: ['v*']

# Deliberately no `RUSTFLAGS: -D warnings` as in `check.yml`: a release should not
# fail because a dependency started emitting a new warning.
env:
  CARGO_TERM_COLOR: always

jobs:
  crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      # OIDC, so `crates-io-auth-action` can exchange this workflow's identity
      # for a short-lived crates.io token. No API token is stored.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # First, because it costs a second and everything below costs minutes.
      # crates.io refuses a version it already has, so a stale `Cargo.toml`
      # would otherwise fail at the last step and blame the registry.
      - name: Check the tag matches the crate version
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "tag $GITHUB_REF_NAME does not match crate version $version" >&2
            exit 1
          fi

      # Mesa software rasteriser and fontconfig, for the same reason `check.yml`
      # installs them: the `smoke` and `picking` tests request a wgpu adapter
      # and the runners have no GPU.
      - name: Install Mesa Vulkan drivers and fontconfig
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools libfontconfig1-dev

      # A crates.io release can only be yanked, never withdrawn, so the tests
      # run here rather than trusting that CI passed on the tagged commit.
      # `check.yml` remains the broader gate — clippy across every feature
      # combination, the MSRV floors — on the way to main.
      - name: cargo test --all-features
        run: cargo test --all-features

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      # The token above is revoked in the action's post-step, so it lives only
      # for this job.
      - name: Publish
        run: cargo publish --token ${{ steps.auth.outputs.token }}

  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      # OIDC, for provenance. SRI is not usable for ES module imports, so a
      # verifiable link back to this workflow run is the integrity story a
      # consumer loading from a CDN actually gets.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Same fail-fast reasoning as the crate job. `verify-dist.mjs` ties
      # `dist/package.json` to this file, so checking the tag against it here
      # pins the whole chain: tag, crate version, published manifest.
      - name: Check the tag matches the package version
        run: |
          version=$(grep -m1 '^version = ' crates/hephaestus-wasm/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      # Node 22.14 or newer, which is what npm trusted publishing requires.
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm for OIDC support
        # Install v10.9.8 first as a workaround for nodejs/node#62425.
        run: |
          npm install -g npm@10.9.8
          npm install -g npm@latest

      # wasm-pack uses a `wasm-opt` from PATH and downloads its own copy only
      # when it finds none. That download failing is not an error to it — it
      # warns and emits an unoptimized binary — and wasm-opt is worth about a
      # quarter of the bundle, so installing it here keeps a network hiccup
      # from silently shipping 3.9 MB in place of 2.9 MB.
      - name: Install wasm-opt (binaryen)
        env:
          BINARYEN: version_132
          BINARYEN_SHA256: 195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572
        run: |
          curl -fsSL -o binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN/binaryen-$BINARYEN-x86_64-linux.tar.gz"
          echo "$BINARYEN_SHA256  binaryen.tar.gz" | sha256sum -c -
          tar -xzf binaryen.tar.gz
          "$PWD/binaryen-$BINARYEN/bin/wasm-opt" --version
          echo "$PWD/binaryen-$BINARYEN/bin" >> "$GITHUB_PATH"

      # Build and verify in this job rather than inheriting an artifact from
      # `check.yml`: nothing is rebuilt between the verification and the publish,
      # so the bytes that reach the registry are the bytes that were checked.
      - name: Assemble the package
        working-directory: crates/hephaestus-wasm
        run: ./build.sh

      - name: Verify the package
        working-directory: crates/hephaestus-wasm
        run: node verify-dist.mjs

      # A prerelease tag lands on `next`, so `npm install hephaestus-wasm`
      # keeps resolving to the last stable release.
      - name: Determine npm dist-tag
        id: dist-tag
        run: |
          if [[ "$GITHUB_REF_NAME" == *"-dev"* || "$GITHUB_REF_NAME" == *"-rc"* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # The token authenticates the first release only. npm will not accept a
      # trusted publisher for a package that does not exist yet, so until
      # `hephaestus-wasm` is on the registry there is nothing to register one
      # against. Once it is, register `release.yml` as the trusted publisher
      # and delete both this `env:` and the secret it reads — OIDC covers
      # publishing on its own, and a live token that nothing needs is the
      # thing worth removing.
      #
      # `NODE_AUTH_TOKEN` is the name `setup-node`'s generated `.npmrc`
      # interpolates; it is set on the step rather than the job so no earlier
      # step can read it.
      - name: Publish to npm
        working-directory: crates/hephaestus-wasm/dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: npm publish --access=public --provenance --tag ${{ steps.dist-tag.outputs.tag }}
