<!doctype html>
<meta charset="utf-8" />
<title>hephaestus — placeholder swap</title>
<!--
  The page the swap harness drives. Nothing here but the plot: no header, no
  status line, no note. That is the point — the harness hashes whole composited
  frames, so anything else that changes when the renderer finishes would be
  indistinguishable from the plot changing. `www/index.html` is the demo; this
  is the instrument.

  Query string:
    picture=0   drop the placeholder, for the baseline
    nowasm=1    skip the module entirely, for the degradation case
    w= h=       the CSS box, defaulting to the size the picture was made at
-->
<style>
  html, body { margin: 0; background: #fff; }
  /* A positioned box of known size. Both children are absolutely positioned
     inside it, so neither has an intrinsic size that could feed back into
     layout and neither can shift the other. */
  #frame { position: relative; overflow: hidden; }
  #plot { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #ph { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
</style>

<div id="frame">
  <canvas id="plot"></canvas>
  <!-- In the served markup, which is the whole reason it beats the renderer to
       the screen. Generated by `examples/document_placeholder.rs`; copy it to
       www/ alongside the document. -->
  <img id="ph" alt="Observations and trend, by hour" src="../www/document.png" />
</div>

<script>
  // A classic script, so it runs at parse time and the baseline never paints
  // the picture even once. The sizing is here too, for the same reason: a
  // module script is deferred, and a canvas sized after first paint would put
  // a 300x150 box in the recording.
  (() => {
    const q = new URLSearchParams(location.search);
    const cssW = Number(q.get('w') ?? 900);
    const cssH = Number(q.get('h') ?? 420);
    const ratio = window.devicePixelRatio || 1;

    const frame = document.getElementById('frame');
    frame.style.width = `${cssW}px`;
    frame.style.height = `${cssH}px`;

    // The backing store before the renderer sees the canvas: a bare canvas
    // reports 300x150, and the renderer would be built at that size and
    // immediately resized.
    const canvas = document.getElementById('plot');
    canvas.width = Math.round(cssW * ratio);
    canvas.height = Math.round(cssH * ratio);

    if (q.get('picture') === '0') document.getElementById('ph').remove();
  })();
</script>

<script type="module">
  const q = new URLSearchParams(location.search);
  const frame = document.getElementById('frame');
  const canvas = document.getElementById('plot');
  const ph = document.getElementById('ph');

  if (q.has('nowasm')) {
    frame.dataset.static = '';
  } else {
    try {
      const { default: init, PlotView } = await import('../dist/hephaestus.js');
      await init();
      const res = await fetch('../www/document.hep');
      if (!res.ok) throw new Error(`document.hep: ${res.status}`);
      const view = await PlotView.create(canvas, new Uint8Array(await res.arrayBuffer()), {
        colorScheme: 'light',
        saveOnRightClick: 'plot.png',
        placeholder: ph ?? undefined,
      });
      window.__view = view;
      frame.dataset.ready = '';
    } catch (e) {
      frame.dataset.failed = String(e?.message ?? e);
    }
  }
</script>
