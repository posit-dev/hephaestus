<!doctype html>
<meta charset="utf-8" />
<title>hephaestus — plot document in the browser</title>
<style>
  :root { color-scheme: light dark; --fg: #1a1a1a; --bg: #fff; --line: #d8d8d8; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e8e8e8; --bg: #101010; --line: #333; }
  }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--fg);
    font: 14px/1.5 ui-sans-serif, system-ui, sans-serif;
  }
  header { display: flex; gap: 16px; align-items: center; margin-bottom: 16px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0; }
  label, button { font: inherit; }
  /* The plot is sized entirely by CSS. Nothing tells the wasm module how big
     to be — a ResizeObserver picks the box up and the composition re-solves
     its layout at whatever it turns out to be. Drag the handle to see it. */
  #frame {
    resize: both; overflow: hidden; border: 1px solid var(--line);
    width: 900px; height: 420px; min-width: 240px; min-height: 180px;
    max-width: 100%; border-radius: 4px;
  }
  /* The canvas must fill its container and have no intrinsic size of its
     own, or the backing store we set would feed back into the layout. */
  #plot { display: block; width: 100%; height: 100%; }
  #status { opacity: 0.75; }
  code { font-family: ui-monospace, monospace; }

  /* A placeholder is an overlay element, never something drawn into the
     canvas: a canvas's context type is sticky, so calling getContext('2d')
     on it would make the renderer's later getContext('webgl2') — or
     'webgpu', on a wgpu build — return null with no way back. That is why
     the client's `placeholder` option takes an <img> and never touches the
     canvas, and why it reuses the same element `saveOnRightClick` overlays
     rather than stacking a second one. #frame is the positioning context. */
  #frame { position: relative; }
  /* Sized and positioned exactly like the canvas, so it cannot shift the
     layout. object-fit keeps a resize mid-boot a letterbox rather than a
     distortion — the picture was made for one box and the plot re-solves for
     whatever box it actually gets. */
  #ph {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain;
  }
  /* The text fallback for a checkout that has not generated the picture yet.
     Behind the <img>, so it is only ever seen when there isn't one. */
  #loading {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: var(--bg); color: var(--fg); opacity: 0.6;
  }
  #frame[data-ready] #loading { display: none; }
</style>

<header>
  <h1>hephaestus render client</h1>
  <label><input type="radio" name="scheme" value="light" checked /> light</label>
  <label><input type="radio" name="scheme" value="dark" /> dark</label>
  <label><input type="radio" name="scheme" value="auto" /> auto</label>
  <span id="status">loading…</span>
</header>

<div id="frame">
  <canvas id="plot"></canvas>
  <div id="loading">preparing renderer…</div>
  <!-- Generated, not committed:
         cargo run --example document_placeholder \
           --features vello-hybrid,document-read,png
         cp examples/document.png crates/hephaestus-wasm/www/
       In the served HTML rather than fetched by script, which is the point:
       the viewer sees the plot before any module has loaded. A page whose
       producer cannot rasterise simply omits this element. -->
  <img id="ph" alt="Observations and trend, by hour" src="./document.png" />
</div>

<p id="note"></p>

<script type="module">
  const status = document.getElementById('status');
  const note = document.getElementById('note');
  const canvas = document.getElementById('plot');
  const frame = document.getElementById('frame');

  const fail = (msg, hint) => {
    // The ?nowasm= path throws on purpose to stop the boot, and that surfaces
    // here as an unhandled rejection. Leave its message alone.
    if ('static' in frame.dataset) return;
    status.textContent = 'failed';
    note.innerHTML = `<strong>${msg}</strong>` + (hint ? `<br />${hint}` : '');
    const overlay = document.getElementById('loading');
    if (overlay) overlay.textContent = 'unavailable';
  };

  // A module that fails to load never runs its own body, so a static import
  // of a missing file would leave this page sitting on "loading…" with the
  // reason only in the console. Everything below is therefore behind a
  // dynamic import, and these two handlers catch whatever still escapes.
  addEventListener('error', (e) => fail(e.message ?? 'script error'));
  addEventListener('unhandledrejection', (e) => fail(e.reason?.message ?? String(e.reason)));

  const SETUP =
    'Run <code>wasm-pack build --target web --release</code> in ' +
    '<code>crates/hephaestus-wasm</code>, then serve that directory ' +
    '(<code>python3 -m http.server</code>) and open <code>/www/</code>.';

  // `?nowasm=1` skips the import, so the degradation path is something to
  // look at rather than a paragraph: the picture stays, with an ordinary
  // image's context menu, and nothing else happens.
  if (new URLSearchParams(location.search).has('nowasm')) {
    frame.dataset.static = '';
    status.textContent = 'renderer skipped';
    note.textContent =
      'Loaded with ?nowasm=1, so no module was imported. What you see is the ' +
      'static picture the producer emitted — which is also what a browser ' +
      'with no WebGL2 would be left with. Right-click it: it is a real image.';
    throw new Error('renderer skipped by ?nowasm');
  }

  let mod;
  try {
    // dist/ is a sibling of www/, so the server root has to be the crate
    // directory rather than www/ itself. `build.sh` assembles dist/.
    mod = await import('../dist/hephaestus.js');
  } catch (e) {
    fail(`Could not load the module: ${e.message}`, SETUP);
    throw e;
  }
  const { default: init, PlotView, isSupported, hasFonts } = mod;

  try {
    await init();
  } catch (e) {
    fail(`Could not initialise wasm: ${e.message}`, SETUP);
    throw e;
  }

  if (!isSupported()) {
    fail(
      'This browser cannot run the renderer.',
      'The default build needs only a WebGL2 context, so this is unusual — ' +
        'check whether WebGL is disabled or blocklisted. A bundle built with ' +
        'the wgpu backend needs WebGPU instead.',
    );
    throw new Error('renderer unsupported');
  }

  // A browser enumerates no system fonts, so without this the plot draws its
  // chrome and no text at all. Must happen before the first view is created:
  // the first thing a document decodes is its theme, and that is already
  // enough to shape. Not committed — drop any TTF/OTF at www/font.ttf.
  //
  // The Google Fonts route is the same call with a key:
  //   await registerGoogleFont('Inter', { genericFor: 'sans-serif' });
  // No font is registered here on purpose. `PlotView.create` fetches the
  // bundled default (Roboto: regular, bold, italic, bold-italic, covering
  // latin, latin-ext, Greek, Cyrillic and Vietnamese) when nothing else is,
  // which is what lets an embed work with no setup. A page with its own font
  // registers it first and the default is never fetched:
  //
  //   await registerFontFromUrl('/my-font.ttf', { genericFor: 'sans-serif' });

  // Generated, not committed:
  //   cargo run --example document_save --features document-write
  //   cp examples/document.hep crates/hephaestus-wasm/www/
  const docResponse = await fetch('./document.hep');
  if (!docResponse.ok) {
    fail(
      'www/document.hep is missing.',
      'Generate it with <code>cargo run --example document_save --features ' +
        'document-write</code> and copy it into <code>www/</code>.',
    );
    throw new Error('no document');
  }

  // `PlotView.create` resolves only once the first frame is on the canvas, so
  // the client retires the placeholder itself and this page needs no extra
  // signal. The default WebGL2 build has no adapter or device to request, so
  // startup is dominated by shader setup rather than the wasm module; a wgpu
  // build additionally waits on device acquisition and pipeline compilation.
  // `saveOnRightClick` gives the plot an ordinary image's context menu —
  // Save image as…, Copy image, drag-to-save — which a bare <canvas> never
  // offers. It re-renders synchronously before each capture, which is what
  // makes it work on a WebGL2 context whose drawing buffer is not preserved.
  const view = await PlotView.create(canvas, new Uint8Array(await docResponse.arrayBuffer()), {
    colorScheme: 'light',
    saveOnRightClick: 'plot.png',
    // The <img> already on screen. It is retired in the same task as the
    // first draw, so one paint reveals the canvas and hides the picture —
    // and then goes on being the save overlay.
    placeholder: document.getElementById('ph'),
  });
  frame.dataset.ready = '';

  for (const input of document.querySelectorAll('input[name=scheme]')) {
    input.addEventListener('change', (e) => view.setColorScheme(e.target.value));
  }

  const { width, height } = view.hints();
  status.textContent = `${hasFonts() ? 'fonts ready' : 'NO FONTS'}; document hint ${width}\u00d7${height}pt`;
  {
    note.textContent =
      'The plot was on screen before the renderer existed: what you saw first ' +
      'was a picture the producer rasterised, swapped for the live frame in a ' +
      'single paint. Drag the bottom-right corner of the frame — axis ticks ' +
      'and label placement recompute for each size, which the picture could ' +
      'not do. Right-click to save it as a PNG: the same element, in its ' +
      'second phase. Reload with ?nowasm=1 to see what a browser that cannot ' +
      'run the renderer is left with.';
  }
</script>
