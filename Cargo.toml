# `crates/hephaestus-wasm` is deliberately its own workspace rather than a
# member of this one. Cargo only honours `[profile]` at a workspace root, so
# a member could not carry its own size-tuned release profile — the size
# settings a wasm bundle wants (`opt-level = "z"`, `panic = "abort"`) would
# have to live here and would then apply to this crate's native release
# builds, where throughput is the whole point.
[workspace]
exclude = ["crates/hephaestus-wasm"]

[package]
name = "hephaestus"
version = "0.3.0"
edition = "2021"
# What this crate's own source needs. The `vello`, `vello_hybrid` and
# `parley` dependency trees all declare 1.88, so a build that includes any of
# them wants that or newer;
# a renderer-free document writer (`--no-default-features --features
# document-write`) compiles on 1.86, which is what an R package vendoring
# this crate for CRAN has to hit.
rust-version = "1.86"
description = "Backend-agnostic 2D scene renderer for data visualization."
license = "MIT"
repository = "https://github.com/posit-dev/hephaestus"
readme = "README.md"
keywords = ["visualization", "plotting", "graphics", "renderer", "vello"]
categories = ["graphics", "visualization", "rendering::engine"]
# Agent-orientation docs and CI config: useful in the repo, noise in the
# published tarball. `PLAN.md` is gitignored and would never ship anyway.
exclude = ["CLAUDE.md", "src/**/CLAUDE.md", ".github/", "PLAN.md"]

# docs.rs builds default features only unless told otherwise, which would
# hide the `google-fonts`, `geom-*` and datetime-interop items entirely.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["vello", "png"]
vello = ["dep:vello", "dep:wgpu", "dep:pollster", "dep:futures-intrusive", "dep:bytemuck"]
# The sparse-strips GPU backend: path processing and coverage on the CPU, a
# plain render pipeline on the GPU. Independent of `vello` — either, both, or
# neither can be enabled. Two capabilities the compute-shader backend cannot
# offer: rasterising with binary coverage (`set_aliasing_threshold`), which is
# what an id buffer needs, and GPU buffers sized to actual scene content
# rather than fixed caps.
#
# `png` and `skrifa` are not optional here: Apple Color Emoji and most
# Android emoji ship their glyphs as PNG strikes rather than outlines, and
# this backend resolves those itself — see `src/backend/hybrid/glyph_bitmap.rs`
# for why the rasteriser's own strike path cannot be used. Both crates are
# already in the tree, `skrifa` via parley and `png` via this crate's own
# `png` gate.
vello-hybrid = [
    "dep:vello_hybrid",
    "vello_hybrid/wgpu",
    "vello_hybrid/std",
    "dep:glifo",
    "dep:vello_common",
    "vello_common/std",
    "png",
    "dep:skrifa",
    "dep:wgpu",
    "dep:pollster",
    "dep:futures-intrusive",
    "dep:bytemuck",
]
# The same sparse-strip rasteriser against a canvas's WebGL2 context instead of
# wgpu, using precompiled GLSL rather than shader translation. Shares the whole
# scene layer with `vello-hybrid` and can be enabled alongside it or alone.
#
# Alone is the interesting case: it pulls **no wgpu at all**, which is both
# smaller than the WebGPU build and reaches every browser rather than the
# subset with WebGPU. `vello_hybrid/std` is deliberately absent — upstream it
# implies that crate's `wgpu` feature, which would defeat the point — so the
# no-std float path (`libm`) is used instead.
#
# `png` and `skrifa` are required for the same reason as in `vello-hybrid`:
# a PNG-strike emoji is resolved by this crate rather than the rasteriser.
#
# Only `wasm32` compiles the renderer: it talks to a `WebGl2RenderingContext`,
# which exists nowhere else.
webgl = [
    "dep:vello_hybrid",
    "vello_hybrid/webgl",
    "vello_hybrid/libm",
    "dep:glifo",
    "dep:vello_common",
    "vello_common/libm",
    "png",
    "dep:skrifa",
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:web-sys",
]
png = ["dep:png"]
# Raster output formats. Each gate adds one encoder over the RGBA8 buffer a
# `Renderer` already produces, so they cost nothing but the encoder itself —
# unlike `svg` / `pdf`, which need a whole alternative render path. All three
# encoders are pure Rust and build for wasm.
jpeg = ["dep:jpeg-encoder", "dep:jpeg-decoder"]
tiff = ["dep:tiff"]
webp = ["dep:image-webp"]
# Auto-fetch named Google Fonts families on demand. Hits the Google Fonts
# CSS2 API, caches downloaded font files in the platform cache dir, and
# registers them with the running font context. Synchronous network call
# on cache miss; cache hits are offline.
google-fonts = ["dep:ureq", "dep:directories"]
# Read images named by an `http(s)` URL rather than a filesystem path. The
# fetch is synchronous on first use and memoized for the process, like the
# `google-fonts` lookup it mirrors; unlike that one there is no on-disk cache,
# so it adds no dependency beyond the HTTP client. Without it a URL is simply
# a location this build cannot read.
image-url = ["dep:ureq"]
# Live window presentation: opens an OS window, presents rendered frames
# through a wgpu surface, and drives an event loop with resize and pointer
# events. Requires a rasterising backend — the window path presents what a
# `WgpuRenderer` rasterises, and `WindowConfig::backend` picks which one.
# winit stays an implementation detail; the event types are ours.
window = ["dep:winit"]
# Presentation onto an existing HTML canvas, for a wasm build embedded in a
# page. The browser counterpart to `window`: same `WindowApp` / `Frame` /
# `Event` surface and the same blit path, but the host owns the event loop
# and feeds resize and pointer events in from JS. Requires a rasterising
# backend; pulls no winit, which is what keeps a wasm bundle to the web deps
# wgpu needs anyway.
# Only `wasm32` compiles the host itself — `wgpu::SurfaceTarget::Canvas`
# exists solely there — so on any other target the gate is inert.
canvas = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys"]
# Optional datetime-library interop: `From` impls between our temporal
# newtypes (`Date` / `DateTime` / `Time` / `Duration`) and the matching
# types in the named library. All three default off — pick whichever
# matches your downstream code's choice (or none, and convert by hand).
# See `src/scales/interop_*.rs`.
chrono = ["dep:chrono"]
time = ["dep:time"]
jiff = ["dep:jiff"]
# Spatial-geometry parsers for `crate::scales::Geometry`. Each gate
# enables one input format; all three are hand-rolled with no extra deps,
# so toggling them affects only what `Geometry::from_*` constructors
# compile.
geom-wkt = []
geom-wkb = []
geom-geojson = []
# Plot documents: capture a `PlotComposition` to a self-contained binary
# file and rebuild it elsewhere. Split by direction because a wasm
# consumer only ever reads — `document-read` halves the codec it
# compiles and says what the build is. Both are dependency-free and
# hand-rolled, like the `geom-*` parsers.
document-read = []
document-write = []
document = ["document-read", "document-write"]
# Placeholders for future backends — wired through cargo but not implemented yet.
blend2d = []
# Vector output: implements `SceneBuilder` and emits SVG text rather
# than pixels. Needs no GPU and no renderer, so
# `--no-default-features --features document-read,svg` is a "document
# in, SVG out" build on the oldest supported rustc. Hand-rolled apart
# from `skrifa`, which reads glyph outlines for the runs that have no
# source text to emit as `<text>` — it is already in the tree via
# parley, so the gate adds no new dependency. Embedding a raster image
# additionally needs `png`; without it an image draws nothing and is
# reported through `SvgWarning::MissingPngFeature`, the same
# degradation a document without `png` produces.
svg = ["dep:skrifa"]
# Fixed vector output: implements `SceneBuilder` and emits a PDF file
# rather than pixels. Where `svg` aims at output someone can edit, this
# aims at output that looks the same everywhere — so the glyphs a plot
# draws are embedded, always, as a synthesized subset font a few kB in
# size rather than the megabyte face they came from. `skrifa` reads
# those outlines and drives the COLR paint traversal that puts color
# emoji on the page; both it and `flate2` are already in the tree, via
# parley and `png` respectively.
#
# A raster image needs no codec — PDF takes raw samples — so unlike
# `svg` this gate does not imply `png` for images. It does reach for it
# in one place: a *bitmap* color glyph (Apple Color Emoji and most
# Android emoji ship PNG strikes), which has to be decoded before it can
# be re-encoded as an image XObject. Without `png` those glyphs are
# reported through `PdfWarning::MissingPngFeature` and everything else
# still renders.
pdf = ["dep:skrifa", "dep:flate2"]

[dependencies]
kurbo = "0.13"
peniko = "0.6"
thiserror = "2"

# vello + wgpu are pulled in with default-features disabled so each platform
# only compiles the one GPU backend it actually uses. The shared baseline is
# `wgsl` (vello's shaders) + `std`; per-platform backends are added in the
# `[target.*]` tables below.
vello = { version = "0.10", optional = true, default-features = false, features = ["wgpu"] }
# `default-features = false` drops `wgpu_default`, which would drag in every
# wgpu backend and undo the per-platform tables below. `text` is re-added
# because dropping the defaults takes the glyph pipeline with it.
vello_hybrid = { version = "0.2", optional = true, default-features = false, features = [
    "text",
] }
# The glyph type `vello_hybrid`'s glyph-run builder consumes. Neither
# `vello_hybrid` nor `vello_common` re-exports it, so drawing text means naming
# the crate it comes from; version-locked to what `vello_hybrid` resolves.
glifo = { version = "0.3", optional = true, default-features = false }
# `vello_hybrid` re-exports most of what a caller needs but not the paint
# types, so building an image paint means naming the shared crate directly.
# Same resolved version `vello_hybrid` depends on.
vello_common = { version = "0.2", optional = true, default-features = false }
wgpu = { version = "29", optional = true, default-features = false, features = ["wgsl", "std"] }
pollster = { version = "0.4", optional = true }
futures-intrusive = { version = "0.5", optional = true }
png = { version = "0.18", optional = true }
# `FlateDecode` for PDF streams. `default-features = false` plus
# `rust_backend` pins the pure-Rust miniz_oxide path, which is what
# builds for wasm; the same crate arrives transitively with `png`.
flate2 = { version = "1", optional = true, default-features = false, features = ["rust_backend"] }
jpeg-encoder = { version = "0.7", optional = true }
# The decode half of the `jpeg` feature — `jpeg-encoder` is write-only, so
# this is the one format whose two directions come from two crates.
# `default-features = false` drops `rayon`: a plot places one image at a
# time, and a thread pool does not build for wasm.
jpeg-decoder = { version = "0.3", optional = true, default-features = false }
# `default-features = false` drops the fax and jpeg decode paths; we keep only
# the two compressors the writer offers beyond uncompressed and packbits.
tiff = { version = "0.11", optional = true, default-features = false, features = ["deflate", "lzw"] }
image-webp = { version = "0.2", optional = true }
bytemuck = { version = "1", optional = true }
# Windowing — feature-gated; pulled in by `window`. 0.30 is the series that
# uses raw-window-handle 0.6, which is what wgpu 29 resolves to.
winit = { version = "0.30", optional = true }

# Web bindings — feature-gated; pulled in by `canvas`. Only meaningful on
# `wasm32`, but declared unconditionally so `--features canvas` still builds
# (inertly) on a native target rather than failing to resolve.
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "CssStyleDeclaration",
    "WebGl2RenderingContext",
] }
parley = "0.9"
# Glyph outlines, for the `svg` backend's fallback when a run carries no
# source text — a marker shape, or a caller that positioned glyphs
# itself. Already in the tree transitively via parley, so naming it
# directly costs nothing.
skrifa = { version = "0.44", optional = true, default-features = false, features = [
    "std",
] }
# CommonMark parser for rich text. `default-features = false` drops the
# optional HTML-rendering helpers we don't use.
pulldown-cmark = { version = "0.13", default-features = false }
clipper2-rust = "1.1"

# Google Fonts auto-lookup — feature-gated; pulled in by `google-fonts`.
ureq = { version = "2", optional = true, default-features = false, features = ["tls"] }
directories = { version = "5", optional = true }

# Optional datetime-library interop (one of three feature gates).
chrono = { version = "0.4", default-features = false, optional = true }
time = { version = "0.3", default-features = false, optional = true }
jiff = { version = "0.2", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "29", optional = true, default-features = false, features = ["metal"] }

[target.'cfg(target_os = "ios")'.dependencies]
wgpu = { version = "29", optional = true, default-features = false, features = ["metal"] }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios"))))'.dependencies]
wgpu = { version = "29", optional = true, default-features = false, features = ["vulkan", "gles"] }

[target.'cfg(windows)'.dependencies]
wgpu = { version = "29", optional = true, default-features = false, features = ["dx12"] }

# WebGPU only, deliberately. On wasm `wgpu` exists solely to serve `vello`,
# which rasterises through compute pipelines — and WebGL2 has no compute
# stage, so a WebGL adapter could never run this backend. Enabling `webgl`
# would compile `glow` and the GL hal into every wasm bundle to back an
# adapter that is found and then fails inside pipeline creation.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "29", optional = true, default-features = false, features = ["webgpu"] }

